<text x="35" y="720" font-family="sans-serif" font-size="14">La plataforma crece de 1 156 a 2 304 m²; no se escalan globalmente maquinaria ni vegetación.</text><text x="35" y="748" font-family="sans-serif" font-size="14">AABB conservadoras ≠ colisión exacta. Se exceptúan montajes, suelo y vegetación del humedal; no hay física.</text></svg>
