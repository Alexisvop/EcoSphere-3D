<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -240 440 400">
  <rect x="-220" y="-240" width="440" height="400" fill="#fbf8f1" />
  <rect x="-180" y="-220" width="360" height="340" rx="14" fill="#efe7d3" stroke="#b8985a" stroke-width="2" />
  <title>EcoEnergy — Plano educativo Fase 6A (10 px = 1 m)</title>

  <!-- Caminos educativos (ENERGY-003) -->
  <rect x="-17" y="-135" width="34" height="240" fill="#d8cfc0" stroke="#9b8f7a" />
  <rect x="-125" y="-47" width="250" height="34" fill="#d8cfc0" stroke="#9b8f7a" />
  <rect x="-125" y="18" width="250" height="34" fill="#d8cfc0" stroke="#9b8f7a" />

  <!-- Acceso sur (ENERGY-002) y camara inicial -->
  <rect x="-32" y="88" width="64" height="12" fill="#d99326" stroke="#6e4710" />
  <text x="0" y="114" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a2a12">Acceso ENERGY-002 (Z=+9.5 m)</text>
  <polygon points="-5,64 0,52 5,64" fill="#1d5aa6" />
  <text x="10" y="62" font-family="sans-serif" font-size="9" fill="#1d5aa6">Camara (0, 1.7, 6)</text>

  <!-- Zona 1: Generacion Solar (Noroeste) -->
  <rect x="-162" y="-140" width="128" height="85" rx="8" fill="#fce8b2" stroke="#d4941c" stroke-dasharray="4,3" />
  <text x="-98" y="-124" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#5c3d06">1. Energia Solar</text>
  <rect x="-135" y="-106" width="24" height="14" fill="#1f4e79" />
  <rect x="-98" y="-106" width="24" height="14" fill="#1f4e79" />
  <rect x="-135" y="-82" width="24" height="14" fill="#1f4e79" />
  <circle cx="-65" cy="-72" r="9" fill="#2b6cb0" stroke="#f6ad55" stroke-width="2" />
  <rect x="-152" y="-76" width="12" height="18" fill="#d69e2e" />
  <rect x="-38" y="6" width="22" height="12" fill="#2b6cb0" stroke="#ecc94b" stroke-width="2" />
  <text x="-98" y="-60" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4a3718">PV + Seguidor + Inversor</text>

  <!-- Zona 2: Generacion Eolica (Norte / Noreste) -->
  <rect x="-10" y="-208" width="172" height="145" rx="8" fill="#e0f2fe" stroke="#2b6cb0" stroke-dasharray="4,3" />
  <text x="76" y="-192" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a365d">2. Energia Eolica</text>
  <circle cx="35" cy="-155" r="14" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.5" />
  <circle cx="115" cy="-145" r="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" />
  <rect x="46" y="-92" width="22" height="8" fill="#edf2f7" stroke="#ecc94b" stroke-width="2" />
  <circle cx="72" cy="-85" r="6" fill="#4a5568" />
  <circle cx="88" cy="-98" r="5" fill="#dd6b20" />
  <circle cx="102" cy="-98" r="5" fill="#3182ce" />
  <rect x="110" y="-88" width="18" height="14" fill="#b7791f" stroke="#ecc94b" stroke-width="1.5" />
  <text x="76" y="-116" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#1e3a5f">Turbinas + Pala + Generador</text>

  <!-- Zona 3: Transformacion y Distribucion (Centro-Este) -->
  <rect x="28" y="-52" width="134" height="58" rx="6" fill="#edf2f7" stroke="#718096" stroke-dasharray="4,3" />
  <text x="95" y="-38" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2d3748">3. Red y Transformacion</text>
  <rect x="85" y="-28" width="22" height="16" fill="#4a5568" />
  <circle cx="128" cy="-20" r="5" fill="#718096" />
  <rect x="34" y="-22" width="10" height="10" fill="#2b6cb0" />

  <!-- Zona 4: Almacenamiento en Baterias (Sureste) -->
  <rect x="38" y="20" width="124" height="72" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-dasharray="4,3" />
  <text x="100" y="35" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#744210">4. Baterias BESS</text>
  <rect x="74" y="44" width="18" height="14" fill="#2d3748" />
  <rect x="100" y="44" width="18" height="14" fill="#2d3748" />
  <rect x="54" y="46" width="14" height="10" fill="#38a169" stroke="#ecc94b" stroke-width="2" />
  <text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#744210">Racks LiFePO4 + Indicador SoC</text>

  <!-- Zona 5: Movilidad Electrica (Suroeste) -->
  <rect x="-162" y="20" width="124" height="72" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-dasharray="4,3" />
  <text x="-100" y="35" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#234e52">5. Movilidad EV</text>
  <rect x="-112" y="54" width="12" height="10" fill="#2c7a7b" />
  <rect x="-78" y="54" width="12" height="10" fill="#2c7a7b" />
  <rect x="-126" y="38" width="24" height="12" rx="3" fill="#3182ce" />
  <rect x="-84" y="38" width="24" height="12" rx="3" fill="#d69e2e" stroke="#ecc94b" stroke-width="2" />
  <circle cx="-54" cy="48" r="5" fill="#e53e3e" stroke="#ecc94b" stroke-width="1.5" />
  <text x="-100" y="80" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#234e52">Cargadores + EV + Conector</text>

  <!-- Escala y resumen -->
  <path d="M -195 138 L -145 138 M -195 134 L -195 142 M -145 134 L -145 142" stroke="#3a2a12" />
  <text x="-170" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a2a12">5 m</text>
  <text x="25" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a2a12">28 modelos unicos · 6 interactivos · 8 animaciones (4S/2K/2P)</text>
</svg>
